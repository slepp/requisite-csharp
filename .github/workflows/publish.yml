name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH"
            exit 1
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302

      - name: Download exact GitHub release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/package
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Requisite.CSharp.$VERSION.nupkg" \
            --pattern "Requisite.CSharp.$VERSION.snupkg" \
            --dir artifacts/package
          test -f "artifacts/package/Requisite.CSharp.$VERSION.nupkg"
          test -f "artifacts/package/Requisite.CSharp.$VERSION.snupkg"

      - name: Publish exact package
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::NUGET_API_KEY is not configured"
            exit 1
          fi
          dotnet nuget push "artifacts/package/Requisite.CSharp.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --symbol-api-key "$NUGET_API_KEY" \
            --symbol-source https://api.nuget.org/v3/index.json \
            --skip-duplicate
