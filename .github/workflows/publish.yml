name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish
        required: true
        default: 0.1.0
        type: string
      bootstrap:
        description: Use the one-time API key before trusted publishing is available
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Validate version input
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH"
            exit 1
          fi

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302

      - name: Download exact GitHub release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/package
          gh release download "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Requisite.CSharp.$VERSION.nupkg" \
            --pattern "Requisite.CSharp.$VERSION.snupkg" \
            --dir artifacts/package
          test -f "artifacts/package/Requisite.CSharp.$VERSION.nupkg"
          test -f "artifacts/package/Requisite.CSharp.$VERSION.snupkg"

      - name: NuGet login
        if: inputs.bootstrap == false
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish exact package
        shell: bash
        env:
          BOOTSTRAP_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          USE_BOOTSTRAP: ${{ inputs.bootstrap }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$USE_BOOTSTRAP" == "true" ]]; then
            if [[ -z "$BOOTSTRAP_API_KEY" ]]; then
              echo "::error::NUGET_API_KEY is required for the one-time bootstrap"
              exit 1
            fi
            key="$BOOTSTRAP_API_KEY"
          else
            if [[ -z "$OIDC_API_KEY" ]]; then
              echo "::error::NuGet trusted publishing did not issue a temporary key"
              exit 1
            fi
            key="$OIDC_API_KEY"
          fi
          export NUGET_API_KEY="$key"
          export NUGET_SYMBOL_API_KEY="$key"
          dotnet nuget push "artifacts/package/Requisite.CSharp.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
