name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore Requisite.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Requisite.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Requisite.slnx --configuration Release --no-restore

      - name: Test .NET 8
        run: dotnet test tests/Requisite.Tests/Requisite.Tests.csproj --configuration Release --framework net8.0 --no-build

      - name: Test .NET 10
        run: dotnet test tests/Requisite.Tests/Requisite.Tests.csproj --configuration Release --framework net10.0 --no-build

      - name: Run example on .NET 8
        run: dotnet run --project examples/PaymentFlow/PaymentFlow.csproj --configuration Release --framework net8.0 --no-build

      - name: Run example on .NET 10
        run: dotnet run --project examples/PaymentFlow/PaymentFlow.csproj --configuration Release --framework net10.0 --no-build

      - name: Pack
        run: dotnet pack src/Requisite/Requisite.csproj --configuration Release --no-build --no-restore --output artifacts/package

      - name: Inspect package
        run: |
          NUPKG="$(find artifacts/package -maxdepth 1 -name 'Requisite.*.nupkg' -print -quit)"
          SNUPKG="$(find artifacts/package -maxdepth 1 -name 'Requisite.*.snupkg' -print -quit)"
          test -n "$NUPKG"
          test -n "$SNUPKG"
          python3 eng/inspect-package.py "$NUPKG" "$SNUPKG"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: requisite-packages
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          if-no-files-found: error
